<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1052 706" width="1052" height="706" role="img" aria-label="시퀀스" style="display: block; overflow: visible; font-family: 'Noto Sans KR', sans-serif"><rect x="-16" y="-16" width="1052" height="706" fill="#FFFFFF"></rect><defs><marker id="ah" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0 0 L8 4 L0 8 Z" style="fill: #4A5568"></path></marker></defs><g transform="translate(22.8 2.0) scale(1.4167)" style="color: #1F2430" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></g></g><text x="172.0" y="32.0" style="font-size: 22px; font-weight: 700; fill: #1F2430; text-anchor: middle">선행 차량(사고 차량)</text><line x1="150.0" y1="56.0" x2="150.0" y2="664.0" style="stroke: #E1E4EB; stroke-width: 1.5"></line><g transform="translate(476.4 2.0) scale(1.4167)" style="color: #1F2430" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9m2.9 2.8a6.14 6.14 0 0 0-.8 7.5"/><circle cx="12" cy="9" r="2"/><path d="M16.2 4.8c2 2 2.26 5.11.8 7.47M19.1 1.9a9.96 9.96 0 0 1 0 14.1m-9.6 2h5M8 22l4-11l4 11"/></g></g><text x="542.0" y="32.0" style="font-size: 22px; font-weight: 700; fill: #1F2430; text-anchor: middle">허브</text><line x1="520.0" y1="56.0" x2="520.0" y2="664.0" style="stroke: #E1E4EB; stroke-width: 1.5"></line><g transform="translate(821.6 2.0) scale(1.4167)" style="color: #1F2430" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></g></g><text x="912.0" y="32.0" style="font-size: 22px; font-weight: 700; fill: #1F2430; text-anchor: middle">후행 차량</text><line x1="890.0" y1="56.0" x2="890.0" y2="664.0" style="stroke: #E1E4EB; stroke-width: 1.5"></line><rect x="40" y="68" width="960" height="230" style="fill: #F3F7FE"></rect><text x="50.0" y="90.0" style="font-size: 17px; font-weight: 700; fill: #6B7180; text-anchor: start">후행 차량 안내</text><text x="164.0" y="110.0" style="font-size: 18px; font-weight: 700; fill: #1F2430; text-anchor: start">0.0 s  충돌: 10 Hz 차속 감속률 ≥ 14 m/s², Δv ≥ 2.2 m/s</text><path d="M 150.0 150.0 L 520.0 150.0" style="fill: none; stroke: #6C5CE7; stroke-width: 1.8" marker-end="url(#ah)"></path><text x="335.0" y="140.0" style="font-size: 18px; font-weight: 700; fill: #1F2430; text-anchor: middle">+0.5 s  IMPACT 즉시 보고 + 표본 20개</text><text x="520.0" y="180.0" style="font-size: 17px; font-weight: 400; fill: #3F4553; text-anchor: middle">재검증 → 사건 창 열림 · 3점 · 사고 의심(그룹 차량 1대로 확정)</text><path d="M 890.0 216.0 L 520.0 216.0" style="fill: none; stroke: #4A5568; stroke-width: 1.8" marker-end="url(#ah)"></path><text x="705.0" y="206.0" style="font-size: 18px; font-weight: 400; fill: #1F2430; text-anchor: middle">≤ +1 s  후행 차량의 1 s 상태 보고</text><path d="M 520.0 250.0 L 890.0 250.0" style="fill: none; stroke: #6C5CE7; stroke-width: 1.8" marker-end="url(#ah)"></path><text x="705.0" y="240.0" style="font-size: 18px; font-weight: 700; fill: #1F2430; text-anchor: middle">응답 = 뷰: 사고 의심(즉시 발화 등급)</text><text x="550.0" y="278.0" style="font-size: 17px; font-weight: 700; fill: #1F2430; text-anchor: start">&quot;전방 1.9km 사고 의심 구간. 아빠 차량 충돌 확인.</text><text x="550.0" y="302.0" style="font-size: 17px; font-weight: 700; fill: #1F2430; text-anchor: start">교통 막힘 주의, 감속 후 차로를 확인하세요.&quot;</text><text x="550.0" y="326.0" style="font-size: 17px; font-weight: 700; fill: #1F2430; text-anchor: start">— 충돌부터 발화까지 실측 약 1 s</text><rect x="40" y="342" width="960" height="200" style="fill: #FEF3F5"></rect><text x="50.0" y="364.0" style="font-size: 17px; font-weight: 700; fill: #6B7180; text-anchor: start">2차 사고 예방</text><text x="164.0" y="386.0" style="font-size: 17px; font-weight: 400; fill: #1F2430; text-anchor: start">+0~30 s  &quot;괜찮으세요?&quot; 30 s 타이머 하나(설계의 10 s + 20 s 표시는 미확인)</text><text x="164.0" y="410.0" style="font-size: 17px; font-weight: 400; fill: #1F2430; text-anchor: start">[괜찮아요] / [도움 필요] / 음성 · 에어백 1 Hz 조회</text><path d="M 150.0 444.0 L 520.0 444.0" style="fill: none; stroke: #4A5568; stroke-width: 1.8" marker-end="url(#ah)"></path><text x="335.0" y="434.0" style="font-size: 18px; font-weight: 400; fill: #1F2430; text-anchor: middle">응답: &quot;괜찮아요&quot; → 창 닫힘 · 해제 또는 일부 차로 통행</text><path d="M 520.0 480.0 L 890.0 480.0" style="fill: none; stroke: #E8607A; stroke-width: 1.8" marker-end="url(#ah)"></path><text x="705.0" y="470.0" style="font-size: 18px; font-weight: 700; fill: #1F2430; text-anchor: middle">무응답 30 s: +2 → 2단계 &quot;…충돌, 응답 없음 확인. 서행하세요.&quot;</text><text x="164.0" y="508.0" style="font-size: 17px; font-weight: 400; fill: #1F2430; text-anchor: start">사고 차량: &quot;사고 의심을 뒤차와 가족에게 알렸습니다.</text><text x="164.0" y="532.0" style="font-size: 17px; font-weight: 400; fill: #1F2430; text-anchor: start">비상등을 켜고 가드레일 밖으로 대피하세요.&quot; + 응급 카드([119 전화 화면])</text><rect x="40" y="552" width="960" height="108" style="fill: #F0F9F9"></rect><text x="50.0" y="574.0" style="font-size: 17px; font-weight: 700; fill: #6B7180; text-anchor: start">공식 확인·해제</text><path d="M 150.0 596.0 L 520.0 596.0" style="fill: none; stroke: #4A5568; stroke-width: 1.8" marker-end="url(#ah)"></path><text x="335.0" y="586.0" style="font-size: 18px; font-weight: 400; fill: #1F2430; text-anchor: middle">순정 내비 돌발(ACCIDENT) ±2 km</text><path d="M 520.0 630.0 L 890.0 630.0" style="fill: none; stroke: #6C5CE7; stroke-width: 1.8" marker-end="url(#ah)"></path><text x="705.0" y="620.0" style="font-size: 18px; font-weight: 700; fill: #1F2430; text-anchor: middle">&quot;사고 구간(도로 정보 확인). 서행하세요.&quot; — 약 0.5 s</text><text x="520.0" y="658.0" style="font-size: 17px; font-weight: 400; fill: #3F4553; text-anchor: middle">해제: 보고 차량 60 km/h↑ · 3대 통과 · 공식 종료 시각 · 15분 만료</text></svg>