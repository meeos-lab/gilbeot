height="54" style="fill: #F5F6FA"></rect><text x="50.0" y="242.0" style="font-size: 17px; font-weight: 400; fill: #3F4553; text-anchor: start">권고: &quot;전방 3.0km 정체 시작. 지금부터 시속 80까지 서서히 줄이세요.&quot;</text><text x="50.0" y="266.0" style="font-size: 17px; font-weight: 400; fill: #3F4553; text-anchor: start">자차 ≥ 88 km/h 일 때만, 거리와 무관한 단일값(단계 감속 90·70·50 은 기각)</text><text x="40.0" y="300.0" style="font-size: 17px; font-weight: 400; fill: #3F4553; text-anchor: start">단계는 하강하지 않음(5 s 보호) · 다음 정체 꼬리에서 1단계로 복귀하지 않음</text><text x="40.0" y="324.0" style="font-size: 17px; font-weight: 400; fill: #3F4553; text-anchor: start">자차가 꼬리 속도보다 20 km/h 미만으로 높으면 무음 · 오디오 포커스 미요청</text></svg>